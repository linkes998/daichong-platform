<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · YunChong</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/store.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/"><span class="brand-mark">⚡</span><span><span id="brandName">YunChong</span><small id="brandSub">Checkout</small></span></a>
    <div class="topbar-right">
      <button class="btn btn-sm btn-ghost lang-btn" id="langBtn" onclick="toggleLang()">中文</button>
      <a class="btn btn-sm btn-ghost" href="/query.html" data-i18n="nav.query">Order Lookup</a>
    </div>
  </div>
</header>

<section class="sec" style="padding-top:44px">
  <div class="container" style="max-width:760px">
    <div class="card" id="host">
      <div class="skeleton" style="height:320px"></div>
    </div>
  </div>
</section>

<div id="toast-wrap"></div>
<script src="/assets/app.js"></script>
<script src="/assets/i18n.js"></script>
<script>
/* ============================================================
   独立收银台：支持 USDT / 国际信用卡 / PayPal / 国内扫码通道
   ============================================================ */
let ORDER = null, PAYINFO = {}, SANDBOX = true, timer = null;

async function loadOrder() {
  const res = await api('/api/orders/' + ORDER.no);
  if (!res.ok) return false;
  ORDER = res.order;
  if (res.payInfo) PAYINFO = res.payInfo;
  if (typeof res.sandbox === 'boolean') SANDBOX = res.sandbox;
  return true;
}

async function doPay() {
  const b = document.getElementById('mockPay');
  const txEl = document.getElementById('txidInput');
  const txid = txEl ? txEl.value.trim() : '';
  const crypto = ORDER.payKind === 'crypto';
  if (crypto && !SANDBOX && !txid) {
    toast(t('usdt.txidRequired'), 'err');
    if (txEl) txEl.focus();
    return;
  }
  if (b) { b.disabled = true; b.innerHTML = '<span class="spin"></span> …'; }
  const res = await api('/api/orders/' + ORDER.no + '/pay', { method: 'POST', body: txid ? { txid } : {} });
  if (!res.ok) {
    toast(t(res.message || 'toast.orderFail'), 'err');
    if (b) { b.disabled = false; b.textContent = t('usdt.submit'); }
    return;
  }
  ORDER = res.order;
  renderStatus();
}

/* ---------- 头部信息 ---------- */
function infoRows() {
  const o = ORDER;
  return `<div class="info-rows">
      <div class="r"><span class="k">${escapeHtml(t('cashier.product'))}</span><span class="v">${escapeHtml(pick(o.productName))} · ${escapeHtml(t(o.skuName))}</span></div>
      ${o.account
        ? `<div class="r"><span class="k">${escapeHtml(t('cashier.account'))}</span><span class="v"><b>${escapeHtml(o.account)}</b></span></div>`
        : `<div class="r"><span class="k">${escapeHtml(t('cashier.delivery'))}</span><span class="v">${escapeHtml(t('cashier.auto'))}</span></div>`}
    </div>`;
}

function orderNoBlock() {
  return `<div class="oid">${escapeHtml(t('result.orderNo'))} <b>${ORDER.no}</b>
      <button class="btn btn-xs btn-ghost" style="margin-left:6px" onclick="copyText('${ORDER.no}','${escapeHtml(t('toast.copied'))}')">⧉</button></div>`;
}

/* ---------- 渲染 ---------- */
function render() {
  if (!ORDER) return;
  if (ORDER.status !== 'pending_payment') return renderStatus();
  const kind = ORDER.payKind || 'qr';
  if (kind === 'crypto') return renderCrypto();
  if (kind === 'redirect' && !SANDBOX) return renderRedirect();
  return renderMock();
}

function renderCrypto() {
  const host = document.getElementById('host');
  const o = ORDER;
  const cfg = PAYINFO.usdt || {};
  // 收款地址：订单上记录的（BEpusdt 网关逐单分配）> 通道固定地址
  const address = o.payAddress || cfg.address || '';
  const network = o.payNetwork || cfg.network || 'TRC20';
  const amount = o.payForeignAmount || 0;
  const tooSmall = cfg.minAmount && amount < cfg.minAmount;
  // 网关模式：由 BEpusdt 收银台完成付款与链上确认，无需买家回填 TxID
  const gatewayUrl = o.payUrl || '';
  const showGateway = !SANDBOX && o.payGateway === 'bepusdt' && !!gatewayUrl;
  const qr = (() => {
    const tpl = cfg.qrTemplate || '';
    if (tpl && address) {
      const src = tpl.replace(/\{address\}/g, encodeURIComponent(address)).replace(/\{amount\}/g, amount);
      return `<div class="qr"><img src="${escapeHtml(src)}" alt="USDT QR" style="width:100%;height:100%;border-radius:12px"></div>`;
    }
    return `<div class="qr">${qrSvg(address || o.no, 200)}</div>`;
  })();

  host.innerHTML = `<div class="modal-body" style="padding:30px 24px">
    <div class="cashier">
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:4px">
        <span class="chip chip-brand">🪙 USDT · ${escapeHtml(network)}</span>
        <span class="chip chip-warn">${escapeHtml(t('usdt.title'))}</span>
      </div>
      ${address && !tooSmall ? qr : ''}
      <div class="amt"><small>${escapeHtml(amount)}</small> USDT</div>
      ${cfg.rate ? `<div class="muted" style="font-size:12px;text-align:center">¥${money(o.amount)} · ${escapeHtml(t('usdt.rateUnit', money(cfg.rate)))}</div>` : ''}
      ${orderNoBlock()}
      <div class="countdown">⏳ ${escapeHtml(t('cashier.expire'))} <b id="cd">--:--</b></div>
      <div style="max-width:480px;margin:24px auto 0;text-align:left">
        ${
          !address && !showGateway
            ? `<div class="card card-tight" style="background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.3);margin-bottom:16px">
                <div style="font-size:12.5px;color:#ff8598;line-height:1.7">${escapeHtml(t('usdt.unconfigured'))}</div></div>`
            : ''
        }
        ${tooSmall ? `<div class="card card-tight" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);margin-bottom:16px">
                <div style="font-size:12.5px;color:#fbc65e;line-height:1.7">${escapeHtml(t('usdt.tooSmall', cfg.minAmount))}</div></div>` : ''}
        ${infoRows()}
        <div class="usdt-fields">
          <div class="uf"><div class="k">${escapeHtml(t('usdt.network'))}</div><div class="v"><span class="chip chip-brand">${escapeHtml(network)}</span></div></div>
          <div class="uf"><div class="k">${escapeHtml(t('usdt.address'))}</div>
            <div class="v mono" style="word-break:break-all">${escapeHtml(address || '—')}
            ${address ? `<button class="btn btn-xs btn-ghost" onclick="copyText('${escapeHtml(address)}','${escapeHtml(t('usdt.copyAddress'))}')">⧉</button>` : ''}</div></div>
          <div class="uf"><div class="k">${escapeHtml(t('usdt.amount'))}</div>
            <div class="v"><b>${escapeHtml(amount)} USDT</b>
            <button class="btn btn-xs btn-ghost" onclick="copyText('${escapeHtml(amount)}','${escapeHtml(t('usdt.copyAmount'))}')">⧉</button></div></div>
          <div class="uf"><div class="k">${escapeHtml(t('usdt.memo'))}</div><div class="v mono">${escapeHtml(o.no)}</div></div>
        </div>
        <div class="hint" style="margin-top:10px">${escapeHtml(t('usdt.memoHint', o.no))}</div>
        ${cfg.tips ? `<div class="hint hint-warn" style="margin-top:6px">⚠️ ${escapeHtml(t(cfg.tips))}</div>` : ''}

        ${
          showGateway
            ? ''
            : `<div class="field" style="margin-top:18px">
          <label>${escapeHtml(t('usdt.txid'))}<span class="req">*</span></label>
          <input class="input" id="txidInput" placeholder="${escapeHtml(t('usdt.txidPh'))}" autocomplete="off">
          <div class="hint">${escapeHtml(t('usdt.txidHint'))}</div>
        </div>`
        }
        ${SANDBOX ? `<div class="card card-tight" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.28);margin-bottom:14px">
          <div style="font-size:12.5px;color:#fbc65e;line-height:1.7">${escapeHtml(t('cashier.sandboxText'))}</div></div>` : ''}
        ${
          showGateway
            ? `<div class="card card-tight" style="background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.28);margin-bottom:14px">
                 <div style="font-size:12.5px;color:#7ee7f7;line-height:1.7">${escapeHtml(t('gateway.confirmNote'))}</div>
               </div>
               <a class="btn btn-primary btn-block btn-lg" href="${escapeHtml(gatewayUrl)}">${escapeHtml(t('gateway.goPay'))} →</a>
               <div class="hint" style="text-align:center;margin-top:10px">${escapeHtml(t('gateway.autoNote'))}</div>`
            : `<button class="btn btn-primary btn-block btn-lg" id="mockPay">${escapeHtml(SANDBOX ? t('cashier.mockPay') : t('usdt.submit'))}</button>`
        }
        <div style="display:flex;gap:10px;margin-top:14px">
          <a class="btn btn-block" href="/">${escapeHtml(t('pay.home'))}</a>
          <a class="btn btn-block" href="/query.html?kw=${encodeURIComponent(o.no)}">${escapeHtml(t('pay.query'))}</a>
        </div>
      </div>
    </div></div>`;
  const mp = document.getElementById('mockPay');
  if (mp) mp.addEventListener('click', doPay);
  countdown();
}

function renderRedirect() {
  const host = document.getElementById('host');
  const o = ORDER;
  const label = o.payMethod === 'paypal' ? t('pay.paypalTitle') : t('pay.cardTitle');
  host.innerHTML = `<div class="modal-body" style="padding:30px 24px">
    <div class="cashier">
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:6px">
        <span class="chip chip-brand">${escapeHtml(label)}</span>
        <span class="chip chip-warn">${escapeHtml(t('pay.redirect'))}</span>
      </div>
      <div class="amt"><small>¥</small>${money(o.amount)}</div>
      ${o.payForeignAmount ? `<div class="muted" style="font-size:13px;text-align:center">${escapeHtml(t('pay.foreignAmount', o.payCurrency || 'USD'))} <b style="color:var(--text)">${escapeHtml(o.payForeignAmount)} ${escapeHtml(o.payCurrency || '')}</b></div>` : ''}
      ${orderNoBlock()}
      <div class="countdown">⏳ ${escapeHtml(t('cashier.expire'))} <b id="cd">--:--</b></div>
      <div style="max-width:460px;margin:24px auto 0;text-align:left">
        ${infoRows()}
        <div class="card card-tight" style="background:rgba(109,94,252,.08);border-color:rgba(109,94,252,.28);margin-bottom:16px">
          <div style="font-size:12.5px;color:#b3a9ff;line-height:1.7">${escapeHtml(t('pay.redirectNote'))}</div>
        </div>
        <a class="btn btn-primary btn-block btn-lg" id="goPay" href="#">${escapeHtml(t('pay.redirect'))} →</a>
        <div style="display:flex;gap:10px;margin-top:14px">
          <a class="btn btn-block" href="/">${escapeHtml(t('pay.home'))}</a>
          <a class="btn btn-block" href="/query.html?kw=${encodeURIComponent(o.no)}">${escapeHtml(t('pay.query'))}</a>
        </div>
      </div>
    </div></div>`;
  countdown();
  // 跳转地址需要单独取一次（订单详情不返回 payUrl，避免暴露给轮询）
  api('/api/orders/' + o.no + '/paylink').then((r) => {
    const a = document.getElementById('goPay');
    if (a && r && r.ok && r.payUrl) a.href = r.payUrl;
  });
}

function renderMock() {
  const host = document.getElementById('host');
  const o = ORDER;
  host.innerHTML = `<div class="modal-body" style="padding:30px 24px">
    <div class="cashier">
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:4px">
        <span class="chip chip-brand">${escapeHtml(pick(o.payMethodName))}</span>
        <span class="chip chip-warn">${escapeHtml(statusLabel(o.status))}</span>
      </div>
      <div class="qr">${qrSvg(o.payTradeNo || o.no, 200)}</div>
      <div class="amt"><small>¥</small>${money(o.amount)}</div>
      ${orderNoBlock()}
      <div class="countdown">⏳ ${escapeHtml(t('cashier.expire'))} <b id="cd">--:--</b></div>
      <div style="max-width:440px;margin:24px auto 0;text-align:left">
        ${infoRows()}
        ${SANDBOX ? `<div class="card card-tight" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.28);margin:16px 0">
          <div style="font-size:12.5px;color:#fbc65e;line-height:1.7"><b>${escapeHtml(t('cashier.sandboxTitle'))}</b>：${escapeHtml(t('cashier.sandboxText'))}</div></div>` : ''}
        <button class="btn btn-primary btn-block btn-lg" id="mockPay">${escapeHtml(SANDBOX ? t('cashier.mockPay') : t('cashier.iPaid'))}</button>
        <div style="display:flex;gap:10px;margin-top:14px">
          <a class="btn btn-block" href="/">${escapeHtml(t('pay.home'))}</a>
          <a class="btn btn-block" href="/query.html?kw=${encodeURIComponent(o.no)}">${escapeHtml(t('pay.query'))}</a>
        </div>
      </div>
    </div></div>`;
  document.getElementById('mockPay').addEventListener('click', doPay);
  countdown();
}

function countdown() {
  clearInterval(timer);
  const tick = () => {
    const el = document.getElementById('cd');
    if (!el) return clearInterval(timer);
    if (!ORDER.expireAt) { el.textContent = '--:--'; return; }
    const left = new Date(ORDER.expireAt).getTime() - Date.now();
    if (left <= 0) { el.textContent = '00:00'; return; }
    el.textContent = Math.floor(left / 60000) + ':' + String(Math.floor((left % 60000) / 1000)).padStart(2, '0');
  };
  tick();
  timer = setInterval(tick, 1000);
}

function renderStatus() {
  clearInterval(timer);
  const o = ORDER;
  const host = document.getElementById('host');
  const iconMap = { success: '✅', failed: '⚠️', recharging: '🔄', paid: '💳', refunded: '↩️', closed: '🚫' };
  const titleKey = {
    success: 'result.successTitle', failed: 'result.failedTitle', recharging: 'result.rechargingTitle',
    paid: 'result.paidTitle', refunded: 'result.refundedTitle', closed: 'result.closedTitle', pending_payment: 'result.pendingTitle',
  };
  const logs = (o.logs || []).slice().reverse().map((l) => {
    const cls = l.level === 'success' ? 'ok' : l.level === 'error' ? 'err' : l.level === 'warn' ? 'warn' : '';
    return `<div class="tl-item ${cls}"><div class="m">${escapeHtml(t(l.msg))}</div><div class="t">${fmtTime(l.t)}</div></div>`;
  }).join('');
  host.innerHTML = `<div class="modal-body" style="padding:26px">
    <div class="result-head">
      <div class="big">${iconMap[o.status] || '📦'}</div>
      <h3>${escapeHtml(t(titleKey[o.status] || ''))}</h3>
      <p>${escapeHtml(t('result.orderNo'))} ${o.no}</p>
      ${o.status === 'recharging' ? `<div style="margin-top:12px"><span class="spin"></span> <span style="font-size:12.5px;color:var(--text-3);margin-left:6px">${escapeHtml(t('result.rechargingNote'))}</span></div>` : ''}
    </div>
    <div class="info-rows">
      <div class="r"><span class="k">${escapeHtml(t('result.product'))}</span><span class="v">${escapeHtml(pick(o.productName))} · ${escapeHtml(t(o.skuName))}</span></div>
      ${o.account ? `<div class="r"><span class="k">${escapeHtml(t('result.account'))}</span><span class="v"><b>${escapeHtml(o.account)}</b></span></div>` : ''}
      <div class="r"><span class="k">${escapeHtml(t('result.paid'))}</span><span class="v">¥${money(o.amount)}${o.payForeignAmount ? ' · ' + escapeHtml(o.payForeignAmount) + ' ' + escapeHtml(o.payCurrency || '') : ''}</span></div>
      ${o.payTxId ? `<div class="r"><span class="k">TxID</span><span class="v mono" style="word-break:break-all">${escapeHtml(o.payTxId)}</span></div>` : ''}
      <div class="r"><span class="k">${escapeHtml(t('result.supplier'))}</span><span class="v">${escapeHtml(pick(o.supplierName) || '—')}${o.supplierOrderNo ? ' · ' + escapeHtml(o.supplierOrderNo) : ''}</span></div>
    </div>
    <div class="sec-title" style="margin-top:0"><span class="n">✓</span>${escapeHtml(t('result.timeline'))}</div>
    <div class="timeline">${logs}</div>
    <div style="display:flex;gap:10px;margin-top:22px">
      <a class="btn btn-block" href="/">${escapeHtml(t('pay.home'))}</a>
      <a class="btn btn-primary btn-block" href="/query.html?kw=${o.no}">${escapeHtml(t('pay.query'))}</a>
    </div>
  </div>`;
}

function rerenderAll() {
  if (!ORDER) return;
  document.getElementById('brandName').textContent = t('brand.name');
  const sub = document.getElementById('brandSub');
  if (sub) sub.textContent = t('brand.sub2');
  document.title = t('cashier.title') + ' · ' + t('brand.name');
  render();
}

async function boot() {
  await initI18n();
  document.title = t('cashier.title') + ' · ' + t('brand.name');
  document.getElementById('brandName').textContent = t('brand.name');
  const sub = document.getElementById('brandSub');
  if (sub) sub.textContent = t('brand.sub2');

  const no = qs('no');
  const host = document.getElementById('host');
  if (!no) {
    host.innerHTML = `<div class="empty"><div class="big">🧾</div>${escapeHtml(t('pay.noOrder'))}<div style="margin-top:14px"><a class="btn btn-sm" href="/query.html">${escapeHtml(t('pay.toQuery'))}</a></div></div>`;
    return;
  }
  const ok = await loadOrder();
  if (!ok) {
    host.innerHTML = `<div class="empty"><div class="big">🔍</div>${escapeHtml(t('pay.notFound'))}</div>`;
    return;
  }
  render();
  onLangChange(rerenderAll);
  poll();
}

function poll() {
  setInterval(async () => {
    if (!ORDER) return;
    const before = ORDER.status;
    await loadOrder();
    if (ORDER.status !== before) render();
    if (['success', 'failed', 'refunded', 'closed'].includes(ORDER.status)) return;
  }, 3000);
}

boot();
</script>
</body>
</html>
